<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Рамка телефона</title>
  <!-- Служебная страница: игра в рамке точного размера телефона (безголовый
       браузер не делает окно уже ~500 px). ?w=390&h=844&shot=window -->
  <style>html, body { margin: 0; background: #000; } iframe { border: 0; display: block; }</style>
</head>
<body>
  <iframe id="f"></iframe>
  <script>
    const q = new URLSearchParams(location.search);
    const f = document.getElementById('f');
    f.width = q.get('w') || 390; f.height = q.get('h') || 844;
    f.src = './?debug=1&shot=' + (q.get('shot') || 'menu') + (q.get('lang') ? '&lang=' + q.get('lang') : '');
  </script>
</body>
</html>
