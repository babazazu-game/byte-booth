<!doctype html>
<!--
  СТАРТОВАЯ РАЗМЕТКА ДЛЯ ИГРЫ ПОД ЯНДЕКС.ИГРЫ.

  Копировать в новую игру целиком и менять только помеченные места:
  название, цвета и фигуру на экране загрузки. Всё остальное здесь стоит
  не «по вкусу», а по конкретным граблям — каждая помечена комментарием
  и пунктом правил площадки.

  Движок не важен: файл одинаково годится и для Phaser, и для Three.js.
  Разница только в том, что игра положит в `#game`, — холст 2D или WebGL.
-->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!--
    `viewport-fit=cover` — обязателен: без него safe-area на телефонах
    с вырезом отдаёт нули, и раскладка считает края экрана не там, где они
    есть. `maximum-scale=1` и `user-scalable=no` убирают двойной тап,
    который иначе зумит игру вместо хода.
  -->
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Железный ларёк · Byte Booth</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:image" content="banner.jpg">

  <!--
    SDK площадки.

    Путь ИМЕННО `/sdk.js`, от корня, и это единственное исключение из правила
    «только относительные пути» (п. 1.7). Файл подставляет сама площадка
    на своём домене; абсолютная ссылка на yandex.ru — сторонний ресурс,
    которого в архиве быть не должно.

    Подключается СИНХРОННО и БЕЗ каких-либо условий: гард вида
    `if (top === self)` ломает инициализацию на черновике в консоли.
    Локально файла нет, `window.YaGames` останется пустым, и каркас сам
    перейдёт на язык браузера — 404 в консоли при разработке это нормально.
  -->
  <script src="/sdk.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      /* fixed + dvh — из-за адресной строки.
         У обычных 100% высота считается по БОЛЬШОМУ вьюпорту, то есть по
         экрану без адресной строки. Пока строка видна, низ холста физически
         находится под ней — так на телефоне срезало нижний ряд интерфейса.
         100dvh — динамическая высота, всегда равная видимой области.
         Строка со 100% оставлена запасным вариантом для браузеров постарше. */
      position: fixed;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #2a1a10;          /* ЦВЕТ ФОНА ИГРЫ */
      /* Блокируем swipe-to-refresh и прокрутку (п. 1.10.2).
         `touch-action: none` на html/body — сознательно, хотя в общем случае
         так делать не стоит: он душит прокрутку на iOS. Если весь интерфейс
         нарисован на холсте, прокручивать нечего, а жест «потянуть вниз для
         обновления» посреди партии — прямое нарушение. Если в игре ЕСТЬ
         прокручиваемые DOM-экраны, эту строку надо убрать. */
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    #game { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #game canvas { display: block; position: absolute; top: 0; left: 0; touch-action: none; }

    /*
      ЭКРАН ЗАГРУЗКИ — РАЗМЕТКОЙ, А НЕ СЦЕНОЙ.

      Он обязан появиться раньше движка. Игра ждёт SDK (язык нужен до первого
      кадра, п. 2.14), потом поднимает движок, потом грузит ассеты — и всё это
      время рисовать нечем. На телефоне отсюда и берётся пустой фон
      на несколько секунд. Разметка же рисуется браузером сразу, ещё до
      единой строчки JS.

      Управляется из `yg-core`: splashProgress / splashCaption / splashHide.
    */
    #splash {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5vmin;
      background: #2a1a10;          /* ТОТ ЖЕ ЦВЕТ, ЧТО У ФОНА */
      z-index: 10;
      transition: opacity .32s ease;
    }
    #splash.done { opacity: 0; pointer-events: none; }

    /* ФИГУРА ИГРЫ. Рисуется разметкой намеренно: ждать загрузки картинки
       на экране загрузки было бы странно. Заменить на свою. */
    /* Монитор, который «загружается»: экран с бегущей строкой и мигающим
       курсором, рядом системник с мигающим светодиодом. Всё разметкой. */
    #splash-mark { position: relative; width: 38vmin; height: 30vmin; max-width: 250px; max-height: 200px; display: flex; align-items: flex-end; gap: 6%; animation: bob 2.4s ease-in-out infinite; }
    #splash-mark .mon { position: relative; flex: 1; height: 82%; display: flex; flex-direction: column; align-items: center; }
    #splash-mark .scr { width: 100%; height: 78%; box-sizing: border-box; border: 1.4vmin solid #ffd25e; border-radius: 1.6vmin; background: #10202a; box-shadow: 0 .8vmin 0 rgba(0,0,0,.25), inset 0 0 3vmin rgba(79,200,255,.35); overflow: hidden; padding: 9% 10%; display: flex; flex-direction: column; gap: 9%; }
    #splash-mark .ln { height: 9%; border-radius: 99px; background: #4fd1c0; opacity: .85; transform-origin: left; animation: type 1.8s steps(6) infinite; }
    #splash-mark .ln:nth-child(2) { width: 70%; animation-delay: .3s; background: #ffd25e; }
    #splash-mark .ln:nth-child(3) { width: 45%; animation-delay: .6s; }
    #splash-mark .cur { width: 10%; height: 12%; background: #fbead6; animation: blink .8s steps(1) infinite; }
    #splash-mark .neck { width: 14%; height: 12%; background: #e9b94a; }
    #splash-mark .foot { width: 46%; height: 6%; border-radius: 99px; background: #ffd25e; }
    #splash-mark .pc { width: 26%; height: 82%; border-radius: 1.2vmin; background: #3a3f47; border: .6vmin solid #ffd25e; box-sizing: border-box; position: relative; box-shadow: 0 .8vmin 0 rgba(0,0,0,.25); }
    #splash-mark .pc::before { content: ''; position: absolute; left: 50%; top: 38%; width: 52%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: .5vmin dashed #ff8a5c; animation: spin 1s linear infinite; }
    #splash-mark .pc::after { content: ''; position: absolute; left: 50%; bottom: 10%; width: 14%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: #5fd38a; box-shadow: 0 0 1.2vmin #5fd38a; animation: blink 1.1s steps(1) infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1vmin); } }
    @keyframes type { 0% { transform: scaleX(.1); } 100% { transform: scaleX(1); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    /* Уважаем системную настройку «меньше движения». */
    @media (prefers-reduced-motion: reduce) {
      #splash-mark, #splash-mark * , #splash-mark .pc::before, #splash-mark .pc::after { animation: none !important; }
    }

    #splash-bar {
      width: 56vmin;
      max-width: 360px;
      height: 2.6vmin;
      min-height: 12px;
      max-height: 18px;
      border-radius: 999px;
      background: rgba(255, 220, 190, .18);
      overflow: hidden;
    }
    #splash-fill {
      width: 0;
      height: 100%;
      border-radius: 999px;
      background: #ffd25e;          /* АКЦЕНТНЫЙ ЦВЕТ ИГРЫ */
      transition: width .2s ease;
    }
    #splash-text {
      font: 700 clamp(14px, 3.2vmin, 22px)/1.2 system-ui, sans-serif;
      color: #fbead6;
      letter-spacing: .02em;
      /* Пусто до тех пор, пока не известен язык: подписать сначала не тем
         языком, а через секунду переписать — ровно то, за что площадка
         делает замечание по п. 2.14. Полоса всё это время уже идёт. */
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ui"></div>

  <div id="splash">
    <div id="splash-mark"><div class="mon"><div class="scr"><div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="cur"></div></div><div class="neck"></div><div class="foot"></div></div><div class="pc"></div></div>
    <div id="splash-bar"><div id="splash-fill"></div></div>
    <div id="splash-text"></div>
  </div>

  <script>
    /*
      Жесты браузера, которые ломают игру, гасятся ДО загрузки движка.

      Контекстное меню по долгому нажатию, выделение текста протяжкой и
      прокрутка страницы пальцем — всё это на холсте выглядит как сбой
      управления. Ставится здесь, а не в игре: до появления движка проходит
      секунда-другая, и попасть в неё пальцем вполне можно.
    */
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('selectstart', (e) => e.preventDefault());
    // touchmove НЕ гасим целиком: в игре есть прокручиваемые DOM-списки (магазин, склад).
    // Холст гасит жесты сам через touch-action: none.
  </script>

  <!-- ТОЧКА ВХОДА ИГРЫ -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
